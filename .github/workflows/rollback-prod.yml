name: Rollback prod

# Déclenchement manuel uniquement, depuis l'onglet Actions du repo.
# Soumis à la même protection GitHub Environment que le déploiement normal
# (approbation manuelle requise) — un rollback en prod reste un déploiement.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "SHA du commit à redéployer (ex. a1b2c3d4...)"
        required: true
        type: string

jobs:
  rollback:
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Synchroniser le fichier compose
        run: cp docker-compose.prod.yml /opt/cave-vin-prod/docker-compose.yml

      - name: Redéployer le tag choisi
        working-directory: /opt/cave-vin-prod
        run: |
          export IMAGE_TAG=${{ inputs.image_tag }}
          docker compose pull
          docker compose up -d
