name: Prod (build, test, deploy)

# Déclenché uniquement par un push sur master — donc en pratique par le
# merge de la PR dev → master.
on:
  push:
    branches: [master]

concurrency:
  group: prod-deploy
  # Ne jamais annuler un déploiement prod en cours.
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # corepack enable est une étape machine, faite une fois pour toutes sur
      # le runner (voir docs/deployment/README.md) — pas la répéter ici,
      # `corepack enable` échoue sans sudo si le Node système appartient à
      # root (cas d'une install via le gestionnaire de paquets du Pi).
      - name: Installer les dépendances
        run: yarn install --frozen-lockfile

      - name: Vérification des types
        run: yarn tsc --noEmit

      - name: Lint
        run: yarn lint

      - name: Tests
        run: yarn test

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pas de cache-from/cache-to: type=gha : le cache GitHub Actions sert
      # les runners cloud éphémères, sans état entre deux runs. Ici le
      # runner self-hosted tourne sur une machine permanente — son démon
      # Docker garde déjà son cache de couches localement d'un run à
      # l'autre, sans rien exporter nulle part. Le cache GHA en mode=max
      # exporte en plus TOUTES les couches (pas seulement l'image finale)
      # vers le service de cache GitHub, ce qui a bloqué un run entier sur
      # la connexion résidentielle du Pi (voir historique de commits).
      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:prod

  deploy-prod:
    needs: build-and-test
    runs-on: self-hosted
    # `environment: production` est ce qui déclenche la protection GitHub
    # (approbation manuelle) — configurée une fois dans Settings > Environments,
    # voir docs/deployment/README.md. Le job reste en attente tant que
    # personne n'a approuvé.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Synchroniser le fichier compose
        run: cp docker-compose.prod.yml /opt/cave-vin-prod/docker-compose.yml

      # `env:` plutôt qu'une interpolation dans le `run:` — voir le commentaire
      # détaillé dans rollback-prod.yml. Ici `github.sha` ne peut pas contenir
      # de métacaractère shell, mais autant garder un seul et même motif.
      - name: Déployer la stack prod
        working-directory: /opt/cave-vin-prod
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose pull
          docker compose up -d
